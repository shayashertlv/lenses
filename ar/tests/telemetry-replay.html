<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AR telemetry replay — deterministic fixture runner</title>

<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/three.module.js",
    "three/addons/": "../vendor/three/addons/"
  }
}
</script>

<style>
  body {
    margin: 0;
    padding: 20px;
    background: #0b0d10;
    color: #e8ecf1;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  #summary { margin: 0 0 14px; font-size: 14px; }
  .ok { color: #4ade80; }
  .fail { color: #fb7185; }
  .line { white-space: pre-wrap; }
  #pick { margin: 0 0 14px; }
  #out { white-space: pre-wrap; }
  #gl { position: fixed; left: -10000px; top: 0; width: 640px; height: 640px; }
</style>
</head>
<body>

<h1>AR telemetry replay</h1>
<p id="summary">waiting for a fixture…</p>
<div id="pick">
  <input type="file" id="file" accept=".ndjson,.gz">
  <span>… or pass ?fixture=&lt;url&gt; / ?fixture=idb:selftest</span>
</div>
<p id="status"></p>
<div id="out"></div>

<canvas id="gl" width="640" height="640"></canvas>

<script type="module" src="./telemetry-replay.js"></script>
</body>
</html>
