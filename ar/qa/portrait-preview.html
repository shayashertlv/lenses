<!doctype html>
<meta charset="utf-8"><link rel="icon" href="data:,"><title>Local portrait AR evidence</title>
<script type="module">
import {TryOnRenderer} from '../src/render/renderer.ts';
import {DetectorClient} from '../src/face/detector.ts';
import {HairClient} from '../src/hair/client.ts';
import {DEFAULT_HAIR_MODEL_ID} from '../src/hair/models.ts';
import {registerModelingAutoEyewear} from '../src/eyewear/catalog.ts';
import {registerPinnedGeometry} from '../src/render/continuity.ts';
import {poseAngles} from '../src/render/pose-stabilizer.ts';
import {lightingConfigurations, createLighting, applyRuntimeLighting} from './provider-comparison-lighting.mjs';
import {eyeCrop, validatePortraitManifest} from './portrait-preview-contract.mjs';

const digest = async bytes => [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(v => v.toString(16).padStart(2, '0')).join('');
const encode = value => new TextEncoder().encode(JSON.stringify(value));
async function run() {
  const manifest = validatePortraitManifest(await fetch('/__portrait/manifest.json').then(r => r.json()));
  const report = {schema_version: 1, status: 'running', captures: [], quality_verdict: 'unmeasured',
    model_sha256: manifest.model_sha256, fixture: manifest.fixture,
    limits: ['Synthetic wearer; supplementary material evidence, not a product reference.',
      'Only the portrait\'s inferred pose is rendered. No invented head turns or real camera access.',
      'The alternate illumination is a QA diagnostic, not an estimate of lighting in the photograph.',
      'A fixed still does not test tracking, real motion, mobile performance or photographic accuracy.']};
  window.portraitReport = report; window.portraitImages = [];
  const signal = new AbortController().signal, detector = new DetectorClient({delegates: ['CPU']}),
    hair = new HairClient(DEFAULT_HAIR_MODEL_ID, {delegate: 'CPU'});
  let instance;
  try {
    const image = new Image(); image.src = '/__portrait/face-a.jpg'; await image.decode();
    const source = document.createElement('canvas'); source.width = image.naturalWidth; source.height = image.naturalHeight;
    if (source.width > 1280 || source.width < 640 || source.height < 640) throw Error('Portrait fixture dimensions outside supported native capture range');
    const context = source.getContext('2d'); context.drawImage(image, 0, 0);
    const sourcePixels = context.getImageData(0, 0, source.width, source.height);
    const pixelHash = await digest(sourcePixels.data);
    await Promise.all([detector.initialize(signal), hair.initialize(signal)]);
    const [detection, mask] = await Promise.all([
      detector.detect(await createImageBitmap(source), 0),
      hair.segment(await createImageBitmap(source), pixelHash, 0),
    ]);
    if (!detection.matrix || detection.landmarks.length < 468) throw Error('The approved portrait did not yield a complete face detection');
    const crop = eyeCrop(detection.landmarks, source.width, source.height);
    const stableDetection = {matrix: detection.matrix, landmarks: detection.landmarks};
    report.source_pixels_sha256 = pixelHash; report.detection = stableDetection;
    report.detection_sha256 = await digest(encode(stableDetection));
    report.inferred_pose = poseAngles(detection.matrix); report.eye_crop = crop;
    report.native_dimensions = [source.width, source.height];
    report.hair = {model: mask.model, model_sha256: mask.modelSHA256, mask_sha256: mask.categorySHA256,
      width: mask.width, height: mask.height, source_sha256: mask.sourceSHA256};
    const capture = (pixels, label, condition, region, sendToAgent = true) => {
      const rect = region === 'eyes' ? crop : {x: 0, y: 0, width: pixels.width, height: pixels.height};
      const canvas = document.createElement('canvas'); canvas.width = rect.width; canvas.height = rect.height;
      canvas.getContext('2d').putImageData(pixels, -rect.x, -rect.y);
      const filename = label + '.png';
      report.captures.push({filename, label, condition, region, crop: rect, width: rect.width, height: rect.height,
        native_pixels: true, resized: false, send_to_agent: sendToAgent});
      window.portraitImages.push({filename, data: canvas.toDataURL('image/png')});
    };
    capture(sourcePixels, 'clean-eye-detail', 'source', 'eyes');
    const assetUrl = '/__portrait/candidate.glb';
    registerPinnedGeometry(assetUrl, manifest.model_sha256);
    registerModelingAutoEyewear({name: 'Portrait inspection', assetUrl, widthMm: manifest.width_mm, templeClipLocalZM: -.14});
    instance = await TryOnRenderer.create(document.createElement('canvas'), signal, 'modeling-auto', {sync: false, steady: null});
    report.asset_integrity = instance.renderedAssetIntegrity;
    report.optical_mesh_count = instance.lensMeshes.length;
    report.continuity_failure = instance.continuityFailure ?? null;
    if (report.asset_integrity?.sha256 !== manifest.model_sha256 || !report.asset_integrity.pinned) throw Error('Rendered GLB identity was not confirmed');
    if (!report.optical_mesh_count || report.continuity_failure) throw Error('Optical geometry or temple continuity unavailable');
    for (let timestamp = 0; timestamp <= 5000; timestamp += 100) {
      if (!instance.pose(source, detection, timestamp)) throw Error('Detected portrait pose was rejected');
    }
    if (!instance.fitting.ready) throw Error('Portrait fitting did not settle: ' + JSON.stringify(instance.fitting));
    report.fitting = instance.fitting;
    report.camera = {view_matrix: instance.camera.matrixWorldInverse.toArray(),
      projection_matrix: instance.camera.projectionMatrix.toArray(), width: source.width, height: source.height};
    report.comparison_key = await digest(encode({fixture: manifest.fixture.sha256,
      detection: report.detection_sha256, camera: report.camera, crop}));
    report.render_conditions = [];
    const diagnostic = lightingConfigurations({environments: [{id: 'condition-b', preset: 'side_studio', intensity: .8}]})[0];
    // Condition A is untouched runtime lighting. Condition B uses the existing QA-only seam and is always restored.
    for (const id of ['condition-a', 'condition-b']) {
      let lighting, restore;
      try {
        if (id === 'condition-b') {lighting = createLighting(instance.renderer, diagnostic); restore = applyRuntimeLighting(instance, lighting);}
        const timing = instance.render(mask), pixels = instance.readback();
        if (pixels.width !== source.width || pixels.height !== source.height) throw Error('Native aspect or resolution was not preserved');
        if (timing.safeFallback || !timing.guarded) throw Error('Portrait render fell back from guarded AR composition');
        report.render_conditions.push({id, lighting: id === 'condition-a' ? 'Unmodified runtime default' : diagnostic,
          timing, fitting: instance.fitting, camera: {view_matrix: instance.camera.matrixWorldInverse.toArray(),
            projection_matrix: instance.camera.projectionMatrix.toArray()}});
        capture(pixels, id + '-portrait', id, 'full', id === 'condition-a');
        capture(pixels, id + '-eye-detail', id, 'eyes');
      } finally {restore?.(); lighting?.dispose();}
    }
    report.status = 'inspected'; return report;
  } finally {instance?.dispose(); detector.close(); hair.close();}
}
window.portraitPreview = {run};
</script>
