<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eyewear · 3D preview</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#e7e7e7;color:#25292b;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:16px;left:18px;right:18px;pointer-events:none}h1{font-size:15px;margin:0 0 5px}#status{font-size:12px;color:#535b60;max-width:560px}nav{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;max-width:95%;padding:6px;background:#fffffff0;border:1px solid #d4d8d9;border-radius:12px;box-shadow:0 4px 18px #0001}button{border:0;padding:9px 12px;border-radius:6px;background:transparent;cursor:pointer;color:inherit}button:hover,button:focus-visible{background:#e5efeb}#error{position:absolute;top:40%;left:10%;right:10%;padding:20px;background:white;border:1px solid #ddd;border-radius:12px;line-height:1.6}#error[hidden]{display:none}@media(max-width:520px){nav{gap:0}button{padding:9px 8px}}
</style></head>
<body><canvas aria-label="Interactive eyewear model"></canvas><header><h1 id="name">Eyewear preview</h1><div id="status">Loading model…</div></header>
<nav aria-label="Model views"><button data-view="fit">Fit</button><button data-view="front">Front</button><button data-view="left">Left</button><button data-view="right">Right</button><button data-view="back">Back</button><button data-view="top">Top</button></nav>
<div id="error" hidden role="alert"></div><script type="module" src="/src/studio/viewer.ts"></script></body></html>
