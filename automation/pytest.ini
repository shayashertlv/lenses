# Shared pytest config for automation/.
# Supported: run from automation/, e.g. python -B -m pytest tests/<file>.py -q
# pythonpath/testpaths let collection also work from the repo root
# (python -B -m pytest automation/tests/<file>.py); tests that read cwd-relative
# data paths still expect automation/ as the working directory.
[pytest]
markers =
    slow: needs host Blender or takes > 15 s; deselect with -m "not slow"
pythonpath = .
testpaths = tests
